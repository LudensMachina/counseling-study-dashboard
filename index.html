<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>心理学学习进度</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #0a0a0a;
      --card: #111111;

      --border: rgba(255,255,255,0.06);

      --text: #fafafa;
      --muted: #71717a;

      --green: #4ade80;

      --track: #27272a;

    }

    body {

      margin: 0;

      background: var(--bg);

      color: var(--text);

      font-family:
        "Inter",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      padding: 56px;

      -webkit-font-smoothing: antialiased;

      text-rendering: optimizeLegibility;

    }

    .container {

      max-width: 1100px;

      margin: 0 auto;

    }

    h1 {

      font-size: 64px;

      font-weight: 800;

      letter-spacing: -3px;

      margin: 0 0 14px 0;

      line-height: 0.95;

    }

    .subtitle {

      color: var(--muted);

      font-size: 15px;

      letter-spacing: 0.3px;

      margin-bottom: 64px;

    }

    .stats {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 18px;

      margin-bottom: 56px;

    }

    .card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 28px;

    }

    .card-title {

      color: var(--muted);

      font-size: 13px;

      margin-bottom: 12px;

      letter-spacing: 0.3px;

    }

    .card-value {

      font-size: 44px;

      font-weight: 700;

      letter-spacing: -2px;

    }

    .section-title {

      font-size: 22px;

      font-weight: 700;

      letter-spacing: -0.8px;

      margin-bottom: 24px;

    }

    .courses {

      display: flex;

      flex-direction: column;

      gap: 18px;

    }

    .course {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 24px;

    }

    .course-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      margin-bottom: 16px;

      gap: 20px;

    }

    .course-left {

      display: flex;

      flex-direction: column;

      gap: 6px;

    }

    .course-name {

      font-size: 18px;

      font-weight: 600;

      letter-spacing: -0.4px;

    }

    .course-tag {

      font-size: 12px;

      color: var(--muted);

    }

    .course-meta {

      font-size: 14px;

      color: var(--muted);

      white-space: nowrap;

    }

    .progress-bar {

      width: 100%;

      height: 10px;

      background: var(--track);

      border-radius: 999px;

      overflow: hidden;

    }

    .progress-fill {

      height: 100%;

      background: var(--green);

      border-radius: 999px;

      transition: width 0.4s ease;

    }

    .footer {

      margin-top: 72px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.7;

    }

    code {

      background: rgba(255,255,255,0.06);

      padding: 2px 6px;

      border-radius: 6px;

      font-size: 12px;

    }

    @media (max-width: 768px) {

      body {
        padding: 28px;
      }

      h1 {
        font-size: 46px;
      }

      .card-value {
        font-size: 36px;
      }

      .course-top {
        flex-direction: column;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>
      心理学学习进度
    </h1>

    <div class="subtitle">
      心理咨询基础培训 · 学习仪表盘
    </div>

    <div class="stats">

      <div class="card">

        <div class="card-title">
          总课程数
        </div>

        <div
          class="card-value"
          id="total-courses"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          已完成学时
        </div>

        <div
          class="card-value"
          id="completed-hours"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          总学时
        </div>

        <div
          class="card-value"
          id="total-hours"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          总进度
        </div>

        <div
          class="card-value"
          id="overall-progress"
        >
          0%
        </div>

      </div>

    </div>

    <div class="section-title">
      课程列表
    </div>

    <div
      class="courses"
      id="courses"
    ></div>

    <div class="footer">

      每次学习后，只需修改
      <code>completed</code>
      的数值即可。

      <br><br>

      注：1 学时 = 45 分钟。

    </div>

  </div>

  <script>

    // =====================================
    // 以后只修改 completed 的数字
    // =====================================

    const courseData = [

      {
        name: "普通心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "社会心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "人格心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "发展心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "异常心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "咨询心理学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "心理测量学",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "心理咨询技能",
        form: "培训形式：录播课",
        total: 48,
        completed: 0
      },

      {
        name: "心理咨询伦理",
        form: "培训形式：录播课",
        total: 24,
        completed: 0
      },

      {
        name: "心理危机干预",
        form: "培训形式：录播课",
        total: 24,
        completed: 0
      },

      {
        name: "心理咨询案例观摩",
        form: "培训形式：直播课",
        total: 24,
        completed: 0
      },

      {
        name: "心理咨询实务训练",
        form: "培训形式：直播课",
        total: 24,
        completed: 0
      }

    ];

    // =====================================

    const coursesContainer =
      document.getElementById("courses");

    let totalHours = 0;

    let completedHours = 0;

    courseData.forEach((course, index) => {

      totalHours += course.total;

      completedHours += course.completed;

      const progress =
        Math.round(
          (course.completed / course.total) * 100
        );

      const courseDiv =
        document.createElement("div");

      courseDiv.className = "course";

      courseDiv.innerHTML = `

        <div class="course-top">

          <div class="course-left">

            <div class="course-name">
              ${index + 1}. ${course.name}
            </div>

            <div class="course-tag">
              ${course.form}
            </div>

          </div>

          <div class="course-meta">
            ${course.completed} / ${course.total} 学时
          </div>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${progress}%"
          ></div>

        </div>

      `;

      coursesContainer.appendChild(courseDiv);

    });

    const overallProgress =
      Math.round(
        (completedHours / totalHours) * 100
      );

    document.getElementById("total-courses")
      .innerText = courseData.length;

    document.getElementById("completed-hours")
      .innerText = completedHours + " 学时";

    document.getElementById("total-hours")
      .innerText = totalHours + " 学时";

    document.getElementById("overall-progress")
      .innerText = overallProgress + "%";

  </script>

</body>
</html>

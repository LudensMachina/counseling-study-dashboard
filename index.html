<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Psychology Learning Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: rgba(255,255,255,0.06);

      --text: #fafafa;
      --muted: #71717a;

      --green: #4ade80;
      --track: #27272a;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        "Inter",
        "SF Pro Display",
        sans-serif;

      padding: 56px;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 64px;
      font-weight: 800;

      letter-spacing: -3px;

      margin: 0 0 14px 0;

      line-height: 0.95;
    }

    .subtitle {
      color: var(--muted);

      font-size: 15px;

      letter-spacing: 0.3px;

      margin-bottom: 64px;
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 18px;

      margin-bottom: 56px;
    }

    .card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 28px;
    }

    .card-title {
      color: var(--muted);

      font-size: 13px;

      margin-bottom: 12px;

      letter-spacing: 0.3px;
    }

    .card-value {
      font-size: 44px;

      font-weight: 700;

      letter-spacing: -2px;
    }

    .section-title {
      font-size: 22px;

      font-weight: 700;

      letter-spacing: -0.8px;

      margin-bottom: 24px;
    }

    .courses {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .course {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 24px;
    }

    .course-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 16px;
    }

    .course-name {
      font-size: 18px;

      font-weight: 600;

      letter-spacing: -0.4px;
    }

    .course-meta {
      font-size: 14px;

      color: var(--muted);
    }

    .progress-bar {
      width: 100%;
      height: 10px;

      background: var(--track);

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-fill {
      height: 100%;

      background: var(--green);

      border-radius: 999px;

      transition: width 0.4s ease;
    }

    .footer {
      margin-top: 72px;

      color: var(--muted);

      font-size: 13px;
    }

    @media (max-width: 768px) {

      body {
        padding: 28px;
      }

      h1 {
        font-size: 46px;
      }

      .card-value {
        font-size: 36px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>
      Psychology<br>
      Learning Dashboard
    </h1>

    <div class="subtitle">
      Personal learning progress tracker
    </div>

    <div class="stats">

      <div class="card">

        <div class="card-title">
          Total Courses
        </div>

        <div
          class="card-value"
          id="total-courses"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Completed Hours
        </div>

        <div
          class="card-value"
          id="completed-hours"
        >
          0h
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Total Hours
        </div>

        <div
          class="card-value"
          id="total-hours"
        >
          0h
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Overall Progress
        </div>

        <div
          class="card-value"
          id="overall-progress"
        >
          0%
        </div>

      </div>

    </div>

    <div class="section-title">
      Courses
    </div>

    <div
      class="courses"
      id="courses"
    ></div>

    <div class="footer">
      Update progress manually in the
      <code>courseData</code> array.
    </div>

  </div>

  <script>

    // ==========================
    // ONLY EDIT THIS PART
    // ==========================

    const courseData = [

      {
        name: "普通心理学",
        total: 48,
        completed: 0
      },

      {
        name: "社会心理学",
        total: 48,
        completed: 0
      },

      {
        name: "人格心理学",
        total: 48,
        completed: 0
      },

      {
        name: "发展心理学",
        total: 48,
        completed: 0
      },

      {
        name: "异常心理学",
        total: 48,
        completed: 0
      },

      {
        name: "咨询心理学",
        total: 48,
        completed: 0
      },

      {
        name: "心理测量学",
        total: 48,
        completed: 0
      },

      {
        name: "心理咨询技能",
        total: 48,
        completed: 0
      }

    ];

    // ==========================

    const coursesContainer =
      document.getElementById("courses");

    let totalHours = 0;
    let completedHours = 0;

    courseData.forEach(course => {

      totalHours += course.total;

      completedHours += course.completed;

      const progress =
        Math.round(
          (course.completed / course.total) * 100
        );

      const courseDiv =
        document.createElement("div");

      courseDiv.className = "course";

      courseDiv.innerHTML = `

        <div class="course-top">

          <div class="course-name">
            ${course.name}
          </div>

          <div class="course-meta">
            ${course.completed} / ${course.total}h
          </div>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${progress}%"
          ></div>

        </div>

      `;

      coursesContainer.appendChild(courseDiv);

    });

    const overallProgress =
      Math.round(
        (completedHours / totalHours) * 100
      );

    document.getElementById("total-courses")
      .innerText = courseData.length;

    document.getElementById("completed-hours")
      .innerText = completedHours + "h";

    document.getElementById("total-hours")
      .innerText = totalHours + "h";

    document.getElementById("overall-progress")
      .innerText = overallProgress + "%";

  </script>

</body>
</html>
